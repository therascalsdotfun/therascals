[package]
name = "rascals-contributor-verdict"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[[bin]]
name = "contributor-verdict"
path = "src/main.rs"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
wasi-http-client = "0.2"
[profile.release]
opt-level = "s"
lto = true
strip = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2.12"
